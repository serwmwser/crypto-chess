name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build app
        env:
          VITE_THIRDWEB_CLIENT_ID: ${{ vars.VITE_THIRDWEB_CLIENT_ID || secrets.VITE_THIRDWEB_CLIENT_ID }}
          VITE_RELAY_URL: ${{ vars.VITE_RELAY_URL }}
          VITE_GROK_TOKEN_ADDRESS: ${{ vars.VITE_GROK_TOKEN_ADDRESS }}
          VITE_CCHESS_TOKEN_ADDRESS: ${{ vars.VITE_CCHESS_TOKEN_ADDRESS }}
          VITE_CCHESS_EXCHANGE_ADDRESS: ${{ vars.VITE_CCHESS_EXCHANGE_ADDRESS }}
          VITE_ESCROW_ADDRESS: ${{ vars.VITE_ESCROW_ADDRESS }}
        run: |
          if [ -z "$VITE_THIRDWEB_CLIENT_ID" ]; then
            echo "::error::Set the VITE_THIRDWEB_CLIENT_ID Actions secret to enable wallet connections."
            exit 1
          fi
          if [ -z "$VITE_RELAY_URL" ]; then
            echo "::warning::VITE_RELAY_URL is not set. The site will deploy, but online games require a configured wss:// relay."
          elif ! printf '%s' "$VITE_RELAY_URL" | grep -Eq '^wss://[^/]+/?$'; then
            echo "::error::VITE_RELAY_URL must be a wss:// endpoint without a path."
            exit 1
          fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
