services:
  - type: web
    name: crypto-chess-relay
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm run server
    healthCheckPath: /healthz
    disk:
      name: relay-rooms
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NODE_ENV
        value: production
      - key: RELAY_DATA_FILE
        value: /var/data/relay-rooms.json
